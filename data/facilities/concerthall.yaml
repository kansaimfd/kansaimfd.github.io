        「大和八木駅から急行を利用して近鉄郡山駅へ。（所要時間約16分）近鉄郡山駅からは徒歩で約7分です」「大阪駅より関西本線（大和路線）・快速を利用してＪＲ郡山駅へ。（所要時間約46分）ＪＲ郡山駅からは徒歩で約15分です」と記載。方角の記載はなし。

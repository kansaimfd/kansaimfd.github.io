        大ホール楽屋「楽屋1(定員8人)・楽屋2(定員8人)・楽屋5(定員5人)・楽屋6(定員5人)・楽屋7(定員5人)・楽屋8(定員10人)」の合計8+8+5+5+5+10=41人。
        小ホール「用途　ミニコンサート、演劇等に利用できる多目的ホール」「収容人数　100名」の記載（大ホール・小ホールとも「多目的ホール」と自称しているためホール種別は多目的とした）。

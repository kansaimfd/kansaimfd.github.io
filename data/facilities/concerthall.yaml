      備考: '施設は「キセラ川西プラザ」（文化棟＋福祉棟）内の1施設。 客席欄は「定員：1,000席（1階席759席、2階席241席）※車イス席5席を含む」と記載されている。 語は「定員」だが、内訳（1階759＋2階241＝1,000）がすべて席数で示され合計と一致するため、 指示書の「内訳が書かれている場合はその総数を採ってよい」に当たると判断し 客席数: 1000 とした。 立見・合唱席など席以外を含む収容人数ではない。表側の見出しも「客席」である。 舞台欄は「プロセニアム幅 16ｍ、奥行 11ｍ、プロセニアム高 9ｍ、面積 約420㎡」と記載。 プロセニアム幅と明記されているため舞台幅として採用。プロセニアム高・舞台面積はスキーマ対象外のため未記録。 ピアノ欄は「コンサートグランドピアノ2台」と記載（種別・メーカーは付属設備使用料金表で確認）。 舞台機構欄に「音響反射板・吊物一式」の記載があり、附属設備使用料金表にも「音響反射板 1式 5,000円」と 料金設定があることから可動・設置式と判断しホール種別を多目的とした （「主要用途：音楽・演劇・舞踏・映画・講演など」の記載とも整合）。 その他欄に「ホワイエ・主催者事務室・親子室・授乳室など」とあり親子室ありと判断。 楽屋は「楽屋101 20名37.55㎡」「楽屋102 3名～5名19.76㎡」「楽屋103 3名～5名24.21㎡」 「楽屋104 3名～5名17.64㎡」「楽屋201 20名48.81㎡」「楽屋202A 10名20.83㎡」 「楽屋202B 10名27.14㎡」と7室の記載。3室が「3名～5名」の幅表記のため、 各室の上限値を用いて合計（20+5+5+5+20+10+10=75）を楽屋収容人数とした。 大会議室は「定員120名・面積180.60㎡」、多目的スタジオAは「定員60名～70名・面積83.74㎡」、 多目的スタジオBは「定員70名～80名・面積101.76㎡」と記載。 定員が幅表記のスタジオは上限値を採用した（A:70、B:80）。築年月・開館年の記載はなし。'

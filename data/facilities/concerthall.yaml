        小ホール平面図（https://minoh-bunka.com/pdf/maple_hall_shou.pdf）にも「舞台寸法　間口4,700　奥行2,700（移動舞台2,400）　高さ2,800」との記載があり、施設利用案内PDF・部屋紹介ページの4.9m/2.9m/3.85mとは数値が異なる。同様に文章表記の4.9m/2.9m/3.85mを採用した。

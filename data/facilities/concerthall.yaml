        「大和八木駅から急行を利用して近鉄郡山駅へ。（所要時間約16分）近鉄郡山駅からは徒歩で約7分です」「大阪駅より関西本線（大和路線）・快速を利用してＪＲ郡山駅へ。（所要時間約46分）ＪＲ郡山駅からは徒歩で約15分です」と記載。方角の記載はなし。
        「駐車場は170台（地上97台と地下73台）のスペースがあります」「駐輪場は129台（北側24台、南側40台、武道場65台）のスペースがあります」と記載。満車時の案内に「三の丸駐車場（南へ400m：有料）」とあるが本施設の駐車場ではないため記録していない。

      備考: 「豊中市立ローズ文化ホールは平成元年7月にオープンした多目的ホールです。」と記載（→築年月 1989-07／ホール種別 多目的）。 ホール概要表の列見出しは「名称／定員／面積／舞台間口／舞台高さ／舞台奥行」で、 「ホール(劇場型)」の行が「定員 308席／面積 358㎡／舞台間口 12m／舞台高さ 5.5m／舞台奥行 10.5m ※2025年3月17日～ ※車いすスペースを含む」。 別行に「ホール(フラット) 最大600名／358㎡／13.6m／26.5m フラットフロアー（舞台迫全面降下） ※椅子・机の使用数により定員に変化あり」。 列見出しは「定員」だが、劇場型の値は「308席」と席数の単位で書かれ、内訳注記が「車いすスペースを含む」のみで 立見・合唱席・ピット席等の加算がないため客席数として採用した。「座席数」という語の記載はサイト内に無い。 舞台幅は開口寸法である「舞台間口 12m」を採用（主舞台寸法の記載は無し）。 フラット時の「13.6m／26.5m」は平土間形態の寸法なので採らない。 楽屋収容人数は諸室面積・定員表の「ローズ文化ホール楽屋1 15㎡ 10人／ローズ文化ホール楽屋2 15㎡ 10人／ ローズ文化ホール楽屋3 10㎡ 2人」の合計 22人。 同表に「会議室 33.8㎡ 14人」もあるが、ホールではないため部屋に含めていない。 パイプオルガンの記載は無し。ホール面積358㎡はスキーマに該当フィールドが無いため記録していない。
    - URL: https://www.toyonaka-hall.jp/rose/access/
      確認日: '2026-08-11'
      項目: [最寄駅, 駐車場]
      備考: 「阪急宝塚線「庄内」駅から北へ約500メートル／徒歩約10分」と記載（距離・分数の両方が公式に書かれている）。 駐車場は「地下 (有料）14台（内車イス用2台）初めの30分は無料。その後30分毎100円。庄内体育館と共用。」と記載。 バスでのアクセスの記載は無し。出口の記載も無し。 公式住所は「〒561-0855 大阪府豊中市野田町4-1」で、登録データの「豊中市曽根東町3丁目7-2」とは異なる。

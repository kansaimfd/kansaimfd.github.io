        「所在地　箕面市箕面5丁目11番23号」「開館年月日　昭和63年(1988年)11月3日」の記載。
        大ホール「用途　コンサート、演劇等に利用できる多目的ホール」「収容人数　501席（オーケストラピット部分77席を含む）　アリーナ　186席　車椅子席・親子席」と記載。
        501席の内訳末尾に「親子席」の記載があるため親子室:trueとした。「アリーナ186席」は別配置時の収容人数とみられ、通常時の501席を客席数として採用。

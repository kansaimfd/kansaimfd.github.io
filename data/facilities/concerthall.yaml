      備考: |-
        料金URL（price.html）からリンクされる「附属設備の利用料」PDF（令和4年5月1日現在）。
        ●楽器・その他の区分に「ピアノ　外国製フルコンサート　1台　16,500円／外国製コンサート　1台　13,200円／国産フルコンサート　1台　9,900円／国産（レセプション用）　1台　1,650円」「電子ピアノ　1台　1,100円」「オルガン　1台　1,650円」「マリンバ　1台　1,650円」と記載。
        price.html本文に「外国製（スタインウェイ）ピアノを利用されるときは調律が必要です」「ヤマハ製ピアノの調律は442Hzでお願いします」とあり、外国製＝スタインウェイ、国産＝ヤマハと判明した。
        ●舞台設備の区分に「指揮者用譜面台　1台　220円」「演奏者用譜面台　1台　55円」と記載。
        ピアノ・譜面台のいずれも「大ホール」「小ホール」といった内訳の記載がなく（同じ表内の音響反射板・演台・金屏風の行は大ホール用／小ホール用／レセプションホール用と個別に記載があるのに対し、楽器・その他および舞台設備の譜面台の行にはそうした区分がない）、施設共通の設備として大ホール・小ホールの双方に記録した。
        「オルガン」はこの表に貸出品（可搬型と見られる）として1,650円で掲載されているのみで、パイプオルガンを指す記載ではないと考えられる。パイプオルガンについては、この表を含め確認した全ページ（aboutUs.htmlの大ホール「機構」欄にも音響反射板・オーケストラピット・前舞台迫り等の記載はあるがパイプオルガンの記載はない）のいずれにも見当たらなかった。「パイプオルガンはありません」という明示的な否定の記載も見つからなかったため、パイプオルガンのフィールドは省略した（false扱いにはしていない）。
        マリンバは打楽器に該当するが、設置場所（大ホール／小ホール等）の記載がなく部屋を特定できないため、大ホール・小ホールの打楽器フィールドには反映していない。
        譜面台の常備台数（「◯台まで」等）の記載はなく、譜面台数は記録していない。

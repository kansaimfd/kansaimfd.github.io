      備考: |-
        公益財団法人西宮市文化振興財団の公式サイト。登録URL（https://amityhall.jp/）はDNS解決不能（ドメイン失効）のため、curlで生HTMLを取得したこのページを現行の公式URLとした。
        「〒662-0918 西宮市六湛寺町10番11号　TEL：(0798)33-3111／FAX：(0798)33-1441」と記載（住所は登録の「六湛寺町10-11」と一致）。
        「休館日　毎週火曜日（火曜日が祝日の場合翌平日）と、年末年始(12月29日～1月3日)」と記載。
        アクセス欄に「阪神西宮駅「市役所口」改札北へ徒歩1分」「JR西宮駅から西徒歩約10分」と記載。登録データ「阪神本線 西宮駅 徒歩3分」は徒歩分数が公式（1分）と一致しない。方角の記載は阪神西宮駅側が北（市役所口改札から北へ）、JR西宮駅側は西（駅から見て西方向）。
        駐車場について「当ホールには専用駐車場はありません。市役所前線東向いの市役所前公共駐車場をご利用ください。」と明記（フッターにも「お客様専用駐車場はございません。」と重複記載）。来場者専用の駐車場が無いため0とした。
        「空き情報の検索」リンク（https://yoyaku-nishi.growone.net/manabinet/Welcome.cgi）を予約・空き状況確認の申込URLとした。
        施設の愛称について：トップページのタイトルは「西宮市民会館 (アミティ・ベイコムホール)」。これはネーミングライツにより2021年6月1日から付与された愛称（株式会社ベイ・コミュニケーションズとの協定、以降更新継続）で、期間限定の愛称のため施設名としては採用せず登録名「西宮市民会館(アミティホール)」のまま変更していない。
        会議室での楽器使用について「下記の場合を除き、原則楽器の使用はできません。」としたうえで「大会議室101は、楽器練習等にご利用いただけます。ただし、太鼓・ドラム・パーカッション等(振動のある楽器)、他の会議室の利用者に妨げとなるような大きな音を出す利用はできません。」「中会議室501は、電子ピアノのみ使用可能です。」「中会議室503は、グランドピアノのみ使用可能です。」と記載。上記3室以外（301,302,303,401,402,403,502,601,602）は原則楽器使用不可の対象と判断し、管楽器・打楽器ともfalseとした。
        なお「兵庫県立芸術文化センター」「なるお文化ホール」は同財団が運営する別施設（サイト内メニューに別項目として存在）であり、本レコードには混同していない。

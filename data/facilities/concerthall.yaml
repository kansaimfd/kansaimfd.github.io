      備考: |-
        公式サイト アクセスページ（Shift_JIS、生HTMLをcurl+iconvで取得。WebFetchの要約は「奈良県大和郡山市城内町211-3」「大郭町211-3」など2回とも異なる住所を幻覚したため生HTMLで裏取りした）。

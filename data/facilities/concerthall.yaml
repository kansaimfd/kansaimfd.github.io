      備考: |-
        公式サイト「当ホールについて・施設概要」ページ（Shift_JIS、生HTMLで取得）。TEL：0743-54-8000、開館時間9：00〜21：30、休館日「火曜、第3水曜（祝日の場合は開館）、年末年始12月28日〜1月4日」、駐車場170台と記載。
        大ホールは「プロセニアム形式」「コンサートホール形式（リサイタル・小編成アンサンブル向き）」「コンサートホール形式（オーケストラ公演等大編成向き）」の3形態で仕様が併記されている。
        プロセニアム形式：「収容人員（車椅子席9席を含む）全席使用　1,005席（オケピット使用時　913席）一階席使用　653席（オケピット使用時　561席）」「舞台　間口16.2m　奥行14m　高さ8.5m」「舞台面積478m2」「残響時間：測定値（空席）1.4秒／推定値（満席）1.1秒」。
        コンサートホール形式（小編成向き）：「収容人員（車椅子席9席を含む）全席使用　913席　一階席使用　561席」「舞台　間口20.8m　奥行8.9m　高さ10m」。
        コンサートホール形式（大編成向き）：「舞台面積214m2」「収容人員（車椅子席9席を含む）全席使用　832席　一階席使用　480席」「舞台　間口20.8m　奥行11.5m　高さ10m」「残響時間：測定値（空席）2.1秒／推定値（満席）1.7秒」。
        走行式音響反射板により1つの舞台がプロセニアム形式とコンサートホール形式の間で可変であり、収容人員・間口・奥行のいずれも形態ごとに異なる（下記howToUse.htmlにも「大ホール 480〜1,005人　利用形態により異なります」と明記）。
        客席数・舞台幅は「可変プロセニアムは最大値を採る」の方針に準じ、間口の最大値である20.8m（両コンサートホール形式に共通）を舞台幅として採用した。舞台奥行は「音響反射板を使わない素の値を採る」の方針に準じ、反射板を使用しないプロセニアム形式の奥行14mを採用した。客席数はプロセニアム形式の全席使用時1,005席（車椅子席9席を含む、内訳が「席」で示されているため定員表記でも採用可）を採用した。いずれも他の形態の数値（913/832席、間口16.2m、奥行8.9m・11.5m）は上記の通り併記されている。
        大ホール関連施設「主催者控室、親子室、シャワー室、コインロッカー、コーヒーショップ」の記載により親子室ありと判断。
        楽屋は「楽屋1　定員4人」「楽屋2　定員15人」「楽屋3　定員15人」「楽屋4　定員7人」「楽屋5　定員7人」の5室で合計48人（4+15+15+7+7）。
        小ホールは「舞台面積162m2」「収容人員　309席（車椅子席4席を含む）」「舞台　間口10.8m　奥行　8m　高さ6m」「音響反射板使用時　奥行6.3m」と記載。舞台奥行は反射板不使用時の8mを採用（反射板使用時6.3mは備考として併記）。楽屋は「楽屋6　定員8人」「楽屋7　定員7人」「楽屋8　定員5人」「楽屋9　定員5人」の4室で合計25人。親子室の記載はなし。
        レセプションホールは「面積　218m2（13m×17m）」「備品　ピアノ1台、移動ステージ(2.4m×1.2m)4台、演台1台、花台1台、金屏風1双、丸机11台、角机30台、イス130脚」と記載。ピアノ1台の記載により当室のピアノ有無をtrueとした（種別・メーカーの記載なし）。定員は別ページ（cultureHall.html）の「テーブル使用時：最大110人／立食：最大150人」よりテーブル使用時の110人を採用し、立食時150人は備考に留めた。
        展示室「180m2（15m×12m）　可動式展示パネル23枚」、リハーサル室「107m2（7m×15m）　ダンスバー、鏡付き」、スタジオ「スタジオＡ　13m2　スタジオＢ　17m2」「附属設備　ギターアンプ、ベースアンプ、ドラムセット、キーボード、シンセサイザー」（ドラムセットの記載によりスタジオA・Bとも打楽器貸出ありと判定。ギターアンプ・ベースアンプ・キーボードはピアノではないためピアノ有無には反映していない。管楽器に関する記載はない）。
        会議室「会議室Ａ　定員28人　51m2」「会議室Ｂ　定員30人　51m2」「会議室Ｃ　定員36人　63m2」「会議室Ｂ＋Ｃ　定員66人　114m2」（Ｂ＋Ｃは隣接する2室を合わせて利用する場合の値のため、別室としては記録していない）。
        築年月・沿革に関する記載はこのページを含め確認した全ページ（トップページ・access.html・cultureHall.html・aboutUs.html・howToUse.html・price.html・information.html）に見当たらなかった。

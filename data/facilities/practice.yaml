        地階の説明に「ダンス練習に最適な音楽室１、少人数楽器練習ができる音楽室２（これら２室にはピアノ常設）、ドラムやギター・ベースアンプ等の設備で軽音楽を楽しめる音楽室３があります」と記載。音楽室①②のピアノ有無、音楽室③の打楽器（ドラム）はこの記載を根拠にした。ギター・ベースアンプは本スキーマに対応項目が無いため記録していない。
        なおトップページの別の紹介文には「防音設備とピアノ・音響装置、ドラムなどの設備を備えた３つの音楽室では、個人練習が可能」ともあり、3室まとめてピアノ・ドラムを備えるとも読める書き方だったが、部屋ごとの内訳が明示された本ページの記載を優先した。
        3階の説明に「多目的ホール（約１６０人収容）には、電動ステージや簡易な照明設備、コンサート用のグランドピアノを備えています」と記載。多目的ホールのピアノ有無・種別（グランド）はこれを根拠にした。「収容」であり固定座席の記載が無いため客席数は記録せず定員として扱った。練習場スキーマに舞台幅・舞台奥行・ホール種別が無いため、電動ステージを備える点は記録できずここに残す。
        建物は「地下１階、地上3階建、延床面積は3,673㎡」。

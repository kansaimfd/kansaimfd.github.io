      備考: 「駐車場はあるのか？」に対し「あります。1回1000円での設定のみで時間貸しはしていません。また、機械式駐車場のため車高が1550mmの制限があり1BOX車・RV車などのお車の場合は駐車できない場合がありますので、近隣の駐車場をご利用下さい」と記載。台数の記載が無いため駐車場（台数）は記録できなかった。「楽器などはレンタルできるのか？」に「ウッドベースのみ貸出していますがその他の楽器のレンタルはしていません」との記載あり。休館日の記載はなし
    - URL: https://www.100ban.jp/map/index/index.html
      確認日: '2026-09-13'
      項目:
        - 最寄駅
      備考: 運営会社（株式会社高砂商行）のアクセスマップページに「●三宮駅（JR・阪急・阪神）から徒歩7分」とのみ記載。登録の「海岸線 三宮・花時計前駅 徒歩5分」はスタジオ・建物どちらの公式ページにも一度も出てこなかった。駅座標マスタでの直線距離は 三宮・花時計前駅(海岸線)355m、神戸三宮駅(阪急・阪神)508m、三ノ宮駅(JR)663m、三宮駅(地下鉄山手線・ポートライナー)597m で、登録の徒歩5分は花時計前駅の距離と整合する一方、公式が名指しした「JR・阪急・阪神」はいずれも花時計前駅より遠い。公式ページはJR・阪急・阪神をまとめて「三宮駅」と呼ぶのみで正式な駅名（三ノ宮／神戸三宮）を区別しておらず、地下鉄海岸線への言及も無いため、最寄駅は記録せず報告に委ねる 運営会社のアクセスページに「●三宮駅（JR・阪急・阪神）から徒歩7分」と記載。公式は3事業者をまとめて「三宮駅」と呼んでいるため、駅座標マスタの表記に合わせてJRを三ノ宮駅、阪急・阪神を神戸三宮駅として徒歩7分を両方に付けた。登録されていた「海岸線 三宮・花時計前駅 徒歩5分」は公式のどのページにも出てこないため採らなかった

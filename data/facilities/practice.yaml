      備考: '「平野区民センター（コミュニティプラザ平野）附属設備利用料金」PDF（/plaza/facility/ からリンク）。 「ホール」の区分に「グランドピアノ 1台 1区分につき2,750円 在庫数1」、 備考欄に「ヤマハピアノC-7　ピアノ椅子（ベンチタイプ・背付きタイプ）（無料）　舞台上のみ使用可能」と記載。 よってピアノはホールのみ。他の貸室にピアノの記載はない。 「ホール専用付属備品【打楽器】」の区分に「譜面台 1台 100円」備考「20台まで」とあり、譜面台数20はこの記載による。 同区分に指揮者譜面台・指揮台（各1台500円）の記載もある。 打楽器は同区分にティンパニー（4台まで）・バスドラム・ドラムセット・ビブラフォン・グロッケン・銅鑼・ C.シンバル・S.シンバル・ボンゴ・ウインドチャイム・タンバリン・マラカス・トライアングル・クラベス・ ギロ類の貸出記載があるため 打楽器: true とした。 ただし「打楽器の使用可否」を明示した文はなく、ホール専用付属備品の貸出一覧からの判断である点に注意。 注記に「打楽器1式　10,000円になります。」「打楽器貸出には、楽器及び備品使用申請書が必要です。」とある。 管楽器の可否、音響反射板の記載はこのPDFにはない。'

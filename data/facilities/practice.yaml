      備考: '所在地は「〒650－0042　神戸市中央区波止場町2－8」で登録住所（波止場町2-8）と一致。 アクセスは「JR・阪神「元町駅」東口より南へ徒歩約10分」および別欄で 「電車：JR、阪神「元町駅」から南へ徒歩10分」。バス「神戸シティループ『メリケンパーク』 下車すぐ」の記載もあるが、バス停は最寄駅欄に含めていない。事業者名込みの 「JR」「阪神」表記だったため、data/stations.json の「元町」駅（路線: 本線・東海道線・ 神戸高速線／事業者: 西日本旅客鉄道・阪神電気鉄道）から路線名を補った。 練習室は「大①（280㎡）１室」「大②（210㎡）１室」「小（35㎡）1室」の3室（画像キャプションでは 「大1スタジオ」「大2スタジオ」「小スタジオ」と呼称）。設備は3室とも 「アップライトピアノ、指揮台、ホワイトボード、パイプ椅子（◯脚）、長机（◯台）」 （大①はパイプ椅子90脚・長机8台、大②は80脚・6台、小は10脚・2台）。譜面台の記載はなし。 開館時間・閉館時間は「開館時間」という文言自体は無く、利用区分の時間帯 （9:00〜12:30／13:00〜17:00／17:30〜22:00）の始端・終端から推定した。 管楽器・打楽器は、ページ冒頭の「大人数の楽器演奏や、和太鼓、歌、ダンス、芝居の練習」、 および meta description の「兵庫県神戸市のメリケンパークにある音楽がメインの練習場です。 楽器演奏の他、歌や踊り・芝居の練習場所として、おひとり様からでも利用できます。 『大練習場』では、70人以上の吹奏楽演奏が可能です」という記述から、 大1・大2スタジオにのみ記録した（施設全体の説明文で、どの部屋が該当するかの 明示ではないため、35㎡の小スタジオへは適用していない）。 駐車場は施設専用の記載がなく「自動車：阪神高速3号神戸線『京橋』インターから西へすぐ （近隣にコインパーク多数あり）」とあるのみのため記録していない。 休館日は「年末年始（12/30～1/3）」「特別警報、高潮警報発令による防潮扉閉鎖時」の2件。 申込URL は「予約・お申込み（カレンダーから選べます）」のリンク先 https://reserva.be/kobefdmp。 料金URLは本ページ自体に「施設の料金について」として掲載されているため別ページとして記録していない。 運営（管理運営事業者）は「株式会社ワンウッド」、電話番号・メールアドレスも同一事業者名義。 施設名は本文中の「名称」欄に「フィッシュダンス音楽練習場」と明記され登録名と一致 （サイトのタイトルタグ・ロゴ表記は「フィッシュダンス練習場」だが、本文の正式名称欄は「音楽」を含む）'

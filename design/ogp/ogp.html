<!doctype html>
<!--
  OGP 画像（SNS に URL を貼ったときのカード）の原稿。1200×630。
  これをブラウザで開いて PNG に書き出し、public/ogp.png としてコミットする。
  **窓の高さを 630 ちょうどにすると、下端の府県の帯（92px）が入らないことがある**
  （窓の高さと表示領域の高さは一致しない）。広めに開いて 1200×630 に切り出す。
  色は src/styles/tokens.css、マークは public/favicon.svg と同じもの。
  **tokens.css の色を変えたら、ここも合わせて PNG を作り直す**（画像は CSS 変数を読めない）
-->
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>OGP 原稿</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400..700&family=Noto+Serif+JP:wght@400..700&display=block"
    />
    <style>
      :root {
        --navy-700: #1b2e4b;
        --navy-900: #0f1b30;
        --gold-400: #d4aa45;
        --gold-500: #b8962e;
        --cream: #f8f6f0;
        --line: #e7e2d8;
        --serif: 'Noto Serif JP', serif;
        --sans: 'Noto Sans JP', sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      .card {
        position: relative;
        display: flex;
        flex-direction: column;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: linear-gradient(135deg, var(--navy-700) 0%, var(--navy-900) 100%);
        color: #fff;
      }

      /* 右奥に大きく置く音符。前に出さないよう、ゴールドを薄くして地に沈める */
      .card__mark {
        position: absolute;
        top: -40px;
        right: -70px;
        width: 560px;
        height: 560px;
        opacity: 0.12;
      }

      .card__body {
        position: relative;
        flex: 1;
        padding: 88px 96px 0;
      }

      .card__eyebrow {
        display: flex;
        align-items: center;
        gap: 18px;
        color: var(--gold-400);
        font-family: var(--sans);
        font-size: 22px;
        font-weight: 500;
        letter-spacing: 0.28em;
      }

      .card__eyebrow svg {
        width: 56px;
        height: 56px;
      }

      .card__title {
        margin-top: 40px;
        font-family: var(--serif);
        font-size: 104px;
        font-weight: 700;
        line-height: 1.1;
        letter-spacing: 0.04em;
      }

      .card__accent {
        display: block;
        margin-top: 6px;
        color: var(--gold-400);
        font-size: 72px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      .card__rule {
        width: 96px;
        height: 3px;
        margin-top: 36px;
        background: var(--gold-500);
      }

      .card__lead {
        margin-top: 28px;
        color: var(--line);
        font-family: var(--sans);
        font-size: 30px;
        font-weight: 400;
        letter-spacing: 0.04em;
      }

      /* 下端の帯。府県アクセント（tokens.css の [data-pref]）を並べる */
      .card__prefs {
        position: relative;
        display: flex;
        align-items: center;
        gap: 36px;
        height: 92px;
        padding: 0 96px;
        background: var(--cream);
        font-family: var(--serif);
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.06em;
      }

      .card__pref {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--accent);
      }

      .card__pref::before {
        content: '';
        width: 14px;
        height: 14px;
        border-radius: 50%;
        background: var(--accent);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <svg class="card__mark" viewBox="0 0 48 48" aria-hidden="true">
        <ellipse cx="17" cy="34" rx="6" ry="4.5" transform="rotate(-15 17 34)" fill="#D4AA45" />
        <rect x="22.5" y="13" width="2.5" height="21" rx="1.2" fill="#D4AA45" />
        <path d="M25 13 Q36 17 34 26 Q30 20 25 20 Z" fill="#D4AA45" />
      </svg>

      <div class="card__body">
        <p class="card__eyebrow">
          <!-- public/favicon.svg と同じマーク -->
          <svg viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="24" cy="24" r="23" fill="none" stroke="#B8962E" stroke-width="1.5" />
            <ellipse cx="17" cy="34" rx="6" ry="4.5" transform="rotate(-15 17 34)" fill="#B8962E" />
            <rect x="22.5" y="13" width="2.5" height="21" rx="1.2" fill="#B8962E" />
            <path d="M25 13 Q36 17 34 26 Q30 20 25 20 Z" fill="#B8962E" />
          </svg>
          KANSAI MUSIC FACILITY DIRECTORY
        </p>
        <h1 class="card__title">
          関西音楽施設
          <span class="card__accent">Directory</span>
        </h1>
        <div class="card__rule"></div>
        <p class="card__lead">コンサートホールと音楽練習場を、客席数・設備・最寄駅から探す</p>
      </div>

      <div class="card__prefs">
        <span class="card__pref" style="--accent: #1b2e4b">大阪</span>
        <span class="card__pref" style="--accent: #6b4a3a">京都</span>
        <span class="card__pref" style="--accent: #2d5a4a">兵庫</span>
        <span class="card__pref" style="--accent: #9a7d25">奈良</span>
        <!--
          並べるのは施設のある府県（static-pages.mjs の DESCRIBED_PREFS と同じ）。
          和歌山の施設は1件も無いので外してある。臙脂（#8a3e3e）は tokens.css に残っている
        -->
        <span class="card__pref" style="--accent: #3a5a7a">滋賀</span>
      </div>
    </div>
  </body>
</html>

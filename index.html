<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>関西音楽施設ディレクトリ</title>
    <meta
      name="description"
      content="関西（大阪・京都・兵庫・奈良・滋賀・和歌山）のコンサートホールと音楽練習場を、客席数・舞台寸法・設備・最寄駅から探せる非公式のディレクトリです。"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Webフォントの CSS は描画を止めないように読む（media="print" で取得し、届いたら all に切り替える）。
      日本語は字形ごとに約120の unicode-range に分かれていて、この CSS だけで数百KBある。
      ウェイトは個別に並べず範囲（400..700）で頼む。配られるフォントファイルはどちらも同じ可変フォントで、
      個別指定だとウェイトの数だけ @font-face が複製され CSS が約3倍になる（685KB → 229KB）
    -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400..700&family=Noto+Serif+JP:wght@400..700&display=swap"
      media="print"
      onload="this.media = 'all'"
    />
  </head>
  <body>
    <!--
      JS を実行しない閲覧者とクローラに見せる本文。**<body> は他に何も無い。**
      ビルドが書き出す施設ごとのHTMLでは、ここを施設名・住所・最寄駅・公式サイトに
      差し替える（scripts/static-pages.mjs の renderNoscript）。
      この既定の中身は dev サーバーと、差し替えの対象にならない場合に出る
    -->
    <noscript>
      <div class="noscript">
        <h1>関西音楽施設ディレクトリ</h1>
        <p>
          関西のコンサートホールと音楽練習場を、客席数・設備・最寄駅から探せる非公式のディレクトリです。
        </p>
        <p>絞り込みと地図の表示には JavaScript が要ります。</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
